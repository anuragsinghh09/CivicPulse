{% extends 'base.html' %}

{% set active_role = 'public' %}
{% set current_page = 'register' %}
{% set page_title = 'CivicPulse | Register' %}

{% block content %}
<section class="auth-shell">
  <div class="container">
    <div class="row justify-content-center">
      <div class="col-lg-8">
        <div class="card p-4 p-lg-5">
          <div class="d-flex align-items-center justify-content-between mb-4">
            <div>
              <p class="text-primary fw-semibold mb-1">Citizen registration</p>
              <h2 class="mb-0">Create your account</h2>
            </div>
            <div class="icon-badge">👤</div>
          </div>

          <form method="post" action="{{ url_for('auth.register') }}" data-validate>
            <div class="row g-3">
              <div class="col-md-6">
                <label class="form-label" for="full_name">Full name</label>
                <input type="text" class="form-control" id="full_name" name="full_name" required />
              </div>
              <div class="col-md-6">
                <label class="form-label" for="phone">Phone number</label>
                <input type="tel" class="form-control" id="phone" name="phone" required />
              </div>
              <div class="col-md-12">
                <label class="form-label" for="email">Email address</label>
                <input type="email" class="form-control" id="email" name="email" required />
              </div>
              <div class="col-md-12">
                <label class="form-label" for="password">Password</label>
                <input type="password" class="form-control" id="password" name="password" required />
              </div>
            </div>

            <div class="d-flex justify-content-between align-items-center mt-4">
              <a href="/public/login" class="link-muted">Already have an account?</a>
              <button type="submit" class="btn btn-primary">Register</button>
            </div>
          </form>
        </div>
      </div>
    </div>
  </div>
</section>
{% endblock %}
