{% extends 'base.html' %}

{% set active_role = 'citizen' %}
{% set current_page = 'complaint_form' %}
{% set page_title = 'CivicPulse | Submit Complaint' %}

{% block content %}
<section class="py-5">
  <div class="container">
    <div class="page-header">
      <div class="row align-items-center">
        <div class="col-lg-9">
          <p class="text-primary fw-semibold mb-2">Citizen portal</p>
          <h1 class="mb-0">Submit a civic complaint</h1>
        </div>
      </div>
    </div>

    <div class="form-section">
      <form method="post" action="{{ url_for('citizen.complaint_form') }}" enctype="multipart/form-data" data-validate>
        <div class="row g-4">
          <div class="col-md-6">
            <label class="form-label" for="category">Category</label>
            <select class="form-select" id="category" name="category" required>
              <option value="">Select category</option>
              {% for category in categories %}
                <option value="{{ category.category_id }}">{{ category.name }}</option>
              {% endfor %}
            </select>
          </div>

          <div class="col-md-6">
            <label class="form-label" for="area">Area</label>
            <input type="text" class="form-control" id="area" name="area" placeholder="e.g. Sector 12" required />
          </div>

          <div class="col-md-6">
            <label class="form-label" for="city">City</label>
            <input type="text" class="form-control" id="city" name="city" placeholder="e.g. New Delhi" required />
          </div>

          <div class="col-md-6">
            <label class="form-label" for="pincode">Pincode</label>
            <input type="text" class="form-control" id="pincode" name="pincode" placeholder="e.g. 110001" required />
          </div>

          <div class="col-md-6">
            <label class="form-label" for="latitude">Latitude (optional)</label>
            <input type="number" step="0.000001" class="form-control" id="latitude" name="latitude" placeholder="Optional" />
          </div>

          <div class="col-md-6">
            <label class="form-label" for="longitude">Longitude (optional)</label>
            <input type="number" step="0.000001" class="form-control" id="longitude" name="longitude" placeholder="Optional" />
          </div>

          <div class="col-12">
            <label class="form-label" for="description">Description</label>
            <textarea class="form-control" id="description" name="description" rows="6" placeholder="Describe the issue clearly and include relevant details." required></textarea>
          </div>

          <div class="col-12">
            <label class="form-label">Images</label>
            <div class="alert alert-warning mb-3">Maximum 3 images</div>
            <input type="file" class="form-control" id="complaintImages" name="images" data-image-preview="imagePreview" accept="image/png, image/jpeg" multiple />
            <div class="upload-preview" id="imagePreview"></div>
          </div>
        </div>

        <div class="d-flex justify-content-end mt-4">
          <button type="submit" class="btn btn-primary">Submit complaint</button>
        </div>
      </form>
    </div>
  </div>
</section>
{% endblock %}
