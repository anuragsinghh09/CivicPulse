{% extends 'base.html' %}

{% set active_role = 'citizen' %}
{% set current_page = 'profile' %}
{% set page_title = 'CivicPulse | Profile' %}

{% block content %}
<section class="py-5">
  <div class="container">
    <div class="page-header">
      <div class="row align-items-center">
        <div class="col-md-8">
          <p class="text-primary fw-semibold mb-2">Citizen profile</p>
          <h1 class="mb-0">Account details</h1>
        </div>
      </div>
    </div>

    <div class="card p-4">
      <form method="post" action="{{ url_for('citizen.profile') }}" data-validate>
        <div class="row g-3">
          <div class="col-md-6">
            <label class="form-label" for="full_name">Full name</label>
            <input type="text" class="form-control" id="full_name" name="full_name" value="{{ user.full_name }}" required />
          </div>
          <div class="col-md-6">
            <label class="form-label" for="phone">Phone number</label>
            <input type="tel" class="form-control" id="phone" name="phone" value="{{ user.phone }}" required />
          </div>
          <div class="col-md-12">
            <label class="form-label" for="email">Email address</label>
            <input type="email" class="form-control" id="email" name="email" value="{{ user.email }}" required />
          </div>
        </div>
        <div class="d-flex justify-content-end mt-4">
          <button type="submit" class="btn btn-primary">Save profile</button>
        </div>
      </form>
    </div>
  </div>
</section>
{% endblock %}
